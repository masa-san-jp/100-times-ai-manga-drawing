[project]
name = "manga-drawing"
version = "0.1.0"
description = "Local manga draft batch pipeline with a persistent mock provider"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pillow>=11",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "python-dotenv>=1.2.4",
]

[project.scripts]
manga = "manga_drawing.cli:main"

[project.optional-dependencies]
gemini = [
    "google-genai>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11", "playwright>=1.50"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
