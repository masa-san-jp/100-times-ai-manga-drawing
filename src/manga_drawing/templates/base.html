<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}100 TIMES AI MANGA DRAWING{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css?v=0.9.2"><script src="/static/app.js?v=0.9.2" defer></script></head>
<body data-screen="{% block screen %}{% endblock %}" data-project="{{ project.id if project else '' }}" data-page="{{ page.id if page else '' }}" data-project-version="{{project.version if project else 0}}">
<header><a class="brand" href="/">100 TIMES AI MANGA DRAWING</a><span class="badge">{{ "模擬API・課金なし" if runtime_provider == "mock" else "Gemini" }}</span><div class="header-end"><span id="worker-status" role="status"></span><label class="theme-label"><span class="sr-only">表示</span><select id="theme" aria-label="表示モード"><option value="system">OSに合わせる</option><option value="light">ライト</option><option value="dark">ダーク</option></select></label></div></header>
<p id="app-loading" role="status">画面を読み込み中です。</p><main id="app-main" inert aria-busy="true"><div id="notice" role="alert" hidden></div>{% block content %}{% endblock %}</main>

<dialog id="zoom"><button id="close-zoom">閉じる</button><img alt="候補画像の拡大"></dialog>
</body></html>
