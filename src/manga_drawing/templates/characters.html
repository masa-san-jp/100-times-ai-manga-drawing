{% extends "base.html" %}
{% block screen %}characters{% endblock %}
{% block content %}
<nav><a href="/projects/{{project.id}}">← ページ一覧</a></nav>
<div class="heading"><h1>キャラクター</h1><button id="generate-characters" aria-label="未生成・要修正の人物をまとめて生成">まとめて生成</button></div>
<p id="character-progress" role="status"></p><div id="character-grid" class="character-grid"></div>
<section id="character-recovery" class="panel" hidden><h2>復旧</h2><div id="character-batches"></div></section>
<details class="screen-help"><summary>ヘルプ</summary><p>スケッチから設定画を生成し、人物ごとに採用します。採用した画像をページ作画に使用します。</p><p>指示を修正し、人物ごとに再生成できます。画像は「キャラクターリファレンス／人物キー」にテイク番号付きで保存します。</p></details>
{% endblock %}
